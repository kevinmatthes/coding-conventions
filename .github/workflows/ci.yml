name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  cargo:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: cargo ${{ matrix.subcommand }}
    strategy:
      matrix:
        subcommand:
          - build
          - clippy --all-targets
          - doc --no-deps
          - test

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny check advisories licenses

  cargo-package:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo package --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the declared minimum toolchain
        run: |
          set -euo pipefail

          MSRV="$(awk -F'"' '/^rust-version = / { print $2; exit }' \
                  Cargo.toml)"
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"

      - run: cargo check --locked

  cffconvert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://citationcff/cffconvert@sha256:f8c5dc5fa8013e5c3635b1c2695bf54eac4d319719f8acdbb7b7ad7a778e46ea # 2.0.0
        with:
          args: --validate -i CITATION.cff

  renovate-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          npx -p renovate \
              -c 'renovate-config-validator renovate.json --strict' \
              -y

  formatting:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo fmt --check

  changelog-fragment:
    runs-on: ubuntu-latest
    env:
      GIT_HARVEST_VERSION: "0.4.1"
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        name: install git-harvest's precompiled .deb
        run: |
          set -euo pipefail
          repo=https://github.com/kevinmatthes/git-harvest
          deb="git-harvest_${GIT_HARVEST_VERSION}-1_amd64.deb"
          curl -fsSLo git-harvest.deb \
            "$repo/releases/download/v$GIT_HARVEST_VERSION/$deb"
          sudo dpkg -i git-harvest.deb
          rm git-harvest.deb

      - if: github.event_name == 'pull_request'
        name: a Bucket ::= commit is matched by a committed fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          harvested=no
          while IFS= read -r subject; do
            case "$subject" in
              'Added ::= '* | 'Changed ::= '* | 'Deprecated ::= '* | \
              'Fixed ::= '* | 'Removed ::= '* | 'Security ::= '*)
                harvested=yes ;;
            esac
          done < <(git log --format='%s' "$BASE..$HEAD")

          added=$(git diff --no-renames --diff-filter=A --name-only \
                  "$BASE...$HEAD" -- changelog.d/)

          if [ "$harvested" = yes ] && [ -z "$added" ]; then
            echo "::error::a 'Bucket ::= ' commit on this branch adds no"
            echo "changelog.d/ fragment.  Run 'git harvest scan' and commit"
            echo "the result before merging."
            exit 1
          fi

          scan_dir="$RUNNER_TEMP/harvest"
          git harvest scan --base "$BASE" --output "$scan_dir"

          fresh=("$scan_dir"/*.ron)
          if [ ${#fresh[@]} -eq 0 ]; then
            echo "nothing to harvest; the fragment check passes"
            exit 0
          fi

          normalise() { sed -E 's/Some\("[0-9a-f]+"\)/Some(HASH)/g' "$1"; }
          want=$(normalise "${fresh[0]}")

          for committed in changelog.d/*.ron; do
            if [ "$(normalise "$committed")" = "$want" ]; then
              echo "a committed fragment matches a fresh scan of this branch"
              exit 0
            fi
          done

          echo "::error::'git harvest scan' finds entries that no committed"
          echo "changelog.d/ fragment carries -- the fragment is missing or"
          echo "stale.  Re-run 'git harvest scan' and commit it."
          echo '--- a fresh scan of this branch ---'
          cat "${fresh[0]}"
          exit 1

  gate:
    needs:
      - actionlint
      - cargo
      - cargo-deny
      - cargo-package
      - cffconvert
      - changelog-fragment
      - formatting
      - msrv
      - renovate-linter
    runs-on: ubuntu-latest
    steps:
      - run: bash -c 'exit 0'

################################################################################
